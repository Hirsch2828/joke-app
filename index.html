<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>בדיחה בלחיצה</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#FFE15A">
  <link rel="icon" type="image/png" href="/assets/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Playpen+Sans+Hebrew:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --sun: #FFE15A; --paper: #FFFFFF; --ink: #2B1E4A; --ink-soft: #4A3D6B;
      --red: #F23D2F; --blue: #2E9BFF; --error: #C0261B; --error-bg: #FFE8EC; --hint: #756B92;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink);
      font-family: 'Fredoka', system-ui, sans-serif;
      background: var(--sun) url(assets/bg-dots.svg) repeat;
    }
    body::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 260px;
      background: url(assets/bg-doodles.svg) no-repeat center top; pointer-events: none;
    }
    main {
      position: relative; max-width: 440px; margin: 0 auto; padding: 18px;
      min-height: 100vh; display: flex; flex-direction: column; gap: 14px;
    }
    .logo { display: block; width: 300px; max-width: 100%; margin: 0 auto; }
    .intro { margin: 0; text-align: center; font-size: 17px; font-weight: 500; color: var(--ink-soft); }
    label { font-size: 18px; font-weight: 600; }
    input {
      width: 100%; font: inherit; font-size: 19px; font-weight: 500; color: var(--ink);
      background: var(--paper); border: 3px solid var(--ink); border-radius: 18px;
      padding: 12px 16px; box-shadow: 4px 4px 0 var(--ink); transform: rotate(-0.6deg);
    }
    input::placeholder { color: var(--hint); }
    input:focus { outline: 4px solid var(--blue); outline-offset: 2px; }
    button {
      width: 100%; min-height: 64px; font: inherit; font-size: 24px; font-weight: 700;
      color: #fff; background: var(--red); border: 3px solid var(--ink); border-radius: 999px;
      box-shadow: 0 8px 0 var(--ink); transform: rotate(-1deg); cursor: pointer;
      transition: transform .08s, box-shadow .08s;
    }
    button:active, button:disabled { transform: translateY(6px) rotate(-1deg); box-shadow: 0 2px 0 var(--ink); }
    button:disabled { cursor: default; }
    button:focus-visible { outline: 4px solid var(--blue); outline-offset: 4px; }
    #bubble {
      position: relative; min-height: 190px; margin-top: 10px; padding: 18px;
      background: var(--paper); border: 3px solid var(--ink); border-radius: 28px;
      box-shadow: 6px 6px 0 var(--ink); transform: rotate(1.2deg);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center;
    }
    #mascot { width: 118px; transform-origin: bottom center; animation: bob 2.4s ease-in-out infinite; }
    #text { margin: 0; font-size: 17px; font-weight: 500; color: var(--ink-soft); }
    #bubble[data-state=think] #mascot { animation: squish .5s ease-in-out infinite; }
    #bubble[data-state=joke] { justify-content: flex-start; align-items: stretch; text-align: start; padding-top: 44px; }
    #bubble[data-state=joke] #mascot {
      position: absolute; top: -34px; right: 10px; width: 86px; transform: rotate(8deg);
      animation: roll 1.2s ease-in-out 1 both;
    }
    #bubble[data-state=joke] #text { font-family: 'Playpen Sans Hebrew', 'Fredoka', system-ui, sans-serif; font-size: 25px; line-height: 1.55; color: var(--ink); }
    #bubble[data-state=error] { background: var(--error-bg); }
    #bubble[data-state=error] #mascot { animation: wobble .6s ease-in-out 2; }
    #bubble[data-state=error] #text { color: var(--error); font-weight: 600; }
    footer { margin-top: auto; padding-top: 16px; text-align: center; font-size: 13px; color: var(--ink-soft); }
    @keyframes bob { 50% { transform: translateY(-5px); } }
    @keyframes squish { 50% { transform: scale(.86); } }
    @keyframes roll { 0%,100% { transform: rotate(8deg); } 25% { transform: rotate(-14deg); } 75% { transform: rotate(24deg); } }
    @keyframes wobble { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="assets/logo.svg" alt="בדיחה בלחיצה">
    <p class="intro">כותבים נושא, לוחצים, וצוחקים. בלי נושא, מקבלים בדיחה כללית.</p>
    <form id="form" autocomplete="off">
      <label for="topic">על מה הבדיחה?</label>
      <input id="topic" maxlength="100" placeholder="למשל: חתולים" style="margin:8px 0 18px">
      <button id="btn" type="submit">תנו לי בדיחה!</button>
    </form>
    <div id="bubble" data-state="idle" aria-live="polite">
      <img id="mascot" src="assets/mascot-idle.svg" alt="">
      <p id="text">לוחצים על הכפתור, והבדיחה מופיעה כאן</p>
    </div>
    <footer>מיישם AI ואוטומציה · 53500</footer>
  </main>
  <script>
    const form = document.getElementById('form');
    const topicEl = document.getElementById('topic');
    const btn = document.getElementById('btn');
    const bubble = document.getElementById('bubble');
    const mascot = document.getElementById('mascot');
    const text = document.getElementById('text');

    function setState(state, msg, label) {
      bubble.dataset.state = state;
      mascot.src = 'assets/mascot-' + (state === 'idle' ? 'idle' : state) + '.svg';
      text.textContent = msg;
      if (label) btn.textContent = label;
    }

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const topic = topicEl.value.trim();
      btn.disabled = true;
      setState('think', topic ? 'מחפש בדיחה על ' + topic + '...' : 'מחפש בדיחה...', 'חושב...');
      try {
        const res = await fetch('/api/joke', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ topic }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.joke) throw new Error(data.error || '');
        setState('joke', data.joke, 'עוד בדיחה!');
      } catch (err) {
        setState('error', (err.name === 'TypeError' ? '' : err.message) || 'משהו השתבש. נסו שוב.', 'לנסות שוב');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
